# Pulse SEO Viewer — nginx server block fragment.
# Include inside your `server { }` (HTTPS server) with root pointing at site/.

location /viewer/ {
  # ---------------------------------------------------------- AUTH GATE (REQUIRED)
  # The app ships NO authentication. Protect this path before launch, e.g.:
  #   auth_basic "Pulse SEO Viewer";
  #   auth_basic_user_file /etc/nginx/htpasswd-pulse;
  # or put Cloudflare Access / oauth2-proxy in front.

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=15552000" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  types { application/wasm wasm; }

  # Never serve crawl project files even if one lands here by mistake.
  location ~* \.pulse$ { deny all; }

  # Immutable hashed assets; HTML + sw.js must revalidate.
  location ~* \.(js|css|wasm|png)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location ~* (sw\.js|\.html|\.webmanifest)$ {
    add_header Cache-Control "no-cache";
  }

  try_files $uri $uri/ /viewer/index.html;
}
